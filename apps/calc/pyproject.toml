[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cosmos-calc"
version = "0.1.0"
description = "COSMOS Astrology Platform - Calculation Service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "COSMOS Team" }]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "pyswisseph==2.10.3.2",
    "numpy==1.26.4",
    "pydantic==2.6.3",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_ephe: marks tests that require Swiss Ephemeris data files",
]
